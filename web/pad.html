<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Dynamic Pad</title>
<!--ICON-->
<style>
:root{--bg:#05060a;--fg:#f2f4fa;--dim:#fff9;--line:#ffffff1f;--glass:#ffffff0d;--lo:#ff6a3d;--hi:#56d8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;justify-content:center;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;width:min(560px,100%);padding:max(20px,env(safe-area-inset-top)) 16px 32px;display:flex;flex-direction:column;gap:14px}
h1{margin:6px 0 0;font-size:26px;font-weight:700;letter-spacing:.3px}h1 span{font-weight:400;color:var(--dim)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px 16px;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.card h2{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
#pad{display:flex;align-items:center;gap:12px}#pad b{font-weight:600}#pad i{width:10px;height:10px;border-radius:50%;background:#555;flex:none}#pad.on i{background:#5f8;box-shadow:0 0 10px #5f8}
#pad small{display:block;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--fg);background:#ffffff12;border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer}
button.on{background:#fff;color:#000;border-color:#fff}button:active{transform:scale(.97)}
#status{margin:10px 0 0;color:var(--dim);font-size:13px;min-height:1.4em}
.motors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m{position:relative;height:120px;border-radius:14px;background:#ffffff08;border:1px solid var(--line);overflow:hidden}
.m div{position:absolute;left:0;right:0;bottom:0;height:calc(var(--v,0)*100%);background:linear-gradient(to top,var(--c),transparent);transition:height .03s linear}
.m span{position:absolute;left:12px;top:10px;font-size:13px;color:var(--dim)}.m strong{position:absolute;right:12px;top:8px;font-variant-numeric:tabular-nums}
#lo{--c:var(--lo)}#hi{--c:var(--hi)}
#bands{display:flex;align-items:flex-end;gap:2px;height:56px;margin-top:12px}#bands i{flex:1;height:calc(2px + var(--l,0)*54px);border-radius:2px;background:linear-gradient(to top,var(--lo),var(--hi));opacity:.85}
label.s{display:flex;align-items:center;gap:12px;margin-top:6px}label.s input{flex:1;accent-color:#fff}label.s output{width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
p.help{margin:8px 0 0;color:var(--dim);font-size:13px}
a{color:#9ef}
#note{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;background:#000c;border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:calc(100% - 32px)}
input[type=file]{display:none}
</style></head>
<body>
<canvas id="bg"></canvas>
<main>
  <h1>Dynamic <span>Pad</span></h1>
  <section class="card"><div id="pad"><i></i><div><b id="padname">No controller yet</b><small id="padhint">Connect a controller and press any button.</small></div></div></section>
  <section class="card"><h2>Listen to</h2>
    <div class="row" id="src"></div><input type="file" id="file" accept="audio/*">
    <p id="status">Pick a source. The heavy motor plays the bass, the light motor plays the treble.</p>
  </section>
  <section class="card"><h2>Feel</h2>
    <div class="motors"><div class="m" id="lo"><div></div><span>Heavy · bass</span><strong>0</strong></div><div class="m" id="hi"><div></div><span>Light · treble</span><strong>0</strong></div></div>
    <div id="bands"></div>
    <div class="row" id="mode" style="margin-top:12px"></div>
    <div class="row" style="margin-top:10px;align-items:center"><span style="color:var(--dim);font-size:13px;margin-right:4px">Light motor</span><span class="row" id="hirow"></span></div>
    <label class="s">Strength<input id="gain" type="range" min="0" max="2" step="0.05"><output id="gainv"></output></label>
    <p class="help" id="modehelp"></p>
    <div class="row" style="margin-top:10px"><button id="test">Test motors</button><a style="align-self:center;margin-left:auto" id="open" href="index.html">Open Dynamic</a></div>
  </section>
</main>
<div id="note" hidden></div>
<!--SCRIPT-->
</body></html>
