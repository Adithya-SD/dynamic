<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060a"><title>Dynamic Lite</title>
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{width:100vw;height:100vh;display:block}
#hint{position:fixed;left:0;right:0;bottom:13%;text-align:center;font:600 11px system-ui,sans-serif;color:#fffb;letter-spacing:.2px;pointer-events:none;transition:opacity 1.2s;text-shadow:0 1px 4px #000}
#name{position:fixed;left:0;right:0;top:12%;text-align:center;font:600 12px system-ui,sans-serif;color:#fff;opacity:0;pointer-events:none;transition:opacity .6s;text-shadow:0 1px 4px #000}
</style></head><body>
<canvas id="c"></canvas><div id="name"></div><div id="hint">Tap: next · Hold: mic · Tilt me</div>
<script>
/* Dynamic Lite: the watch version. No fluid simulation: a few hundred particles ride the lines of a sacred-geometry
   curve, wobbling with a slow flow. Tilt the wrist to look around it in 3D, drag to stir, tap for the next pattern,
   hold for the microphone (bass swells the shape). Plain Canvas 2D, capped at 30 fps, drops particles when slow. */
'use strict';
const TAU=Math.PI*2,PHI=(1+Math.sqrt(5))/2,GA=Math.PI*(3-Math.sqrt(5));
const cv=document.getElementById('c'),x=cv.getContext('2d',{alpha:false}),nameEl=document.getElementById('name'),hint=document.getElementById('hint');
let W=0,H=0,R=0,dpr=1;
function size(){dpr=Math.min(devicePixelRatio||1,1.5);W=cv.width=Math.round(innerWidth*dpr);H=cv.height=Math.round(innerHeight*dpr);R=Math.min(W,H)/2*.9;x.fillStyle='#05060a';x.fillRect(0,0,W,H)}
addEventListener('resize',size);size();

/* ---- patterns: f(k,a,t) → [x,y] in -1..1; n strands, a in 0..1 along each ---- */
const flowerC=(()=>{const c=[[0,0]],s=.3;for(let i=0;i<6;i++){const a=TAU*i/6;c.push([Math.cos(a)*s,Math.sin(a)*s])}for(let i=0;i<6;i++){const a=TAU*i/6;c.push([Math.cos(a)*2*s,Math.sin(a)*2*s]);const b=a+Math.PI/6;c.push([Math.cos(b)*s*1.732,Math.sin(b)*s*1.732])}return c})();
const poly=(n,s,a)=>{const e=a*n,i=Math.floor(e)%n,f=e-Math.floor(e),A=TAU*(i*s%n)/n,B=TAU*(((i+1)*s)%n)/n;return[Math.cos(A)*(1-f)+Math.cos(B)*f,Math.sin(A)*(1-f)+Math.sin(B)*f]};
const tri=(k,a,t)=>{const up=k%2?-1:1,s=[.95,.78,.6,.45,.3][k>>1]||.4,e=a*3,i=Math.floor(e)%3,f=e-Math.floor(e),V=j=>[Math.cos(TAU*j/3+Math.PI/2)*s*up,Math.sin(TAU*j/3+Math.PI/2)*s*up];const A=V(i),B=V(i+1);return[A[0]*(1-f)+B[0]*f,A[1]*(1-f)+B[1]*f]};
const PATTERNS=[
 {n:'Flower of Life',s:flowerC.length,f:(k,a)=>[flowerC[k][0]+.3*Math.cos(TAU*a),flowerC[k][1]+.3*Math.sin(TAU*a)]},
 {n:'Golden Spiral',s:3,f:(k,a,t)=>{const th=a*TAU*3.2,r=Math.pow(PHI,th*2/Math.PI)*.028;return[Math.cos(th+k*TAU/3)*r,Math.sin(th+k*TAU/3)*r]}},
 {n:'Mandala',s:3,f:(k,a)=>{const th=a*TAU,r=[.32+.08*Math.cos(12*th),.58+.07*Math.cos(24*th+1),.86+.05*Math.cos(36*th)][k];return[Math.cos(th)*r,Math.sin(th)*r]}},
 {n:'Torus',s:24,f:(k,a,t)=>{const c=TAU*k/24+t*.1;return[Math.cos(c)*.34+Math.cos(TAU*a)*.46,Math.sin(c)*.34+Math.sin(TAU*a)*.46]}},
 {n:'Sri Yantra',s:9,f:tri},
 {n:'Rose',s:3,f:(k,a)=>{const th=a*TAU*(k===0?1:k===1?2:1),m=[5,3,7][k],r=Math.cos(m*th/(k===1?2:1))*(.9-k*.15);return[Math.cos(th)*r,Math.sin(th)*r]}},
 {n:'Star',s:3,f:(k,a)=>{const p=poly([9,11,7][k],[4,5,3][k],a);const s=[.95,.7,.45][k];return[p[0]*s,p[1]*s]}},
 {n:'Infinity',s:4,f:(k,a,t)=>{const th=a*TAU,d=1+Math.sin(th)*Math.sin(th),s=.95-k*.17;return[Math.cos(th)/d*s,Math.sin(th)*Math.cos(th)/d*s*1.25]}},
 {n:'Spirograph',s:2,f:(k,a)=>{const th=a*TAU*(k?7:11),r=k?.37:.31;return[((1-r)*Math.cos(th)+.82*r*Math.cos((1-r)/r*th))*.82,((1-r)*Math.sin(th)-.82*r*Math.sin((1-r)/r*th))*.82]}},
 {n:'Phyllotaxis',s:1,f:(k,a,t)=>{const i=a*340,r=Math.sqrt(i/340)*.95,th=i*GA+t*.08;return[Math.cos(th)*r,Math.sin(th)*r]}},
];
const PAL=[[.45,.55,.65],[.02,.08,.13],[.78,.9,.0],[.55,.6,.68],[.33,.42,.52],[.08,.12,.16]];

/* ---- state ---- */
let pat=0,pal=0,ang=0,t=0,pulse=0,bass=0,N=520,last=0,acc=0,slow=0,idle=0,cycle=0;
const P=[];function spawn(){P.length=0;const s=PATTERNS[pat].s;for(let i=0;i<1100;i++)P.push({k:i%s,a:Math.random(),x:W/2+(Math.random()-.5)*W,y:H/2+(Math.random()-.5)*H,vx:0,vy:0,h:Math.random()})}
spawn();
const tilt={x:0,y:0,tx:0,ty:0,b0:null};
function feed(g,b){if(g==null||b==null)return;if(tilt.b0==null)tilt.b0=b>45?65:20;tilt.tx=Math.max(-1,Math.min(1,g/40));tilt.ty=Math.max(-1,Math.min(1,(b-tilt.b0)/40));tilt.b0+=(b-tilt.b0)*.004}
addEventListener('deviceorientation',e=>feed(e.gamma,e.beta),true);
window.__nativeTilt=(ax,ay,az)=>{const g=Math.hypot(ax,ay,az)||1;feed(Math.asin(Math.max(-1,Math.min(1,-ax/g)))*57.2958,90-Math.atan2(az,ay)*57.2958)};
const ptr={on:false,x:0,y:0};
function show(){nameEl.textContent=PATTERNS[pat].n;nameEl.style.opacity=1;clearTimeout(show.t);show.t=setTimeout(()=>nameEl.style.opacity=0,1400)}
function next(d){pat=(pat+d+PATTERNS.length)%PATTERNS.length;spawn();pulse=1;show();x.fillStyle='#05060a';x.fillRect(0,0,W,H)}
let down=0,sx=0,sy=0,moved=false,lastTap=0,holdT=0;
cv.addEventListener('pointerdown',e=>{down=performance.now();sx=e.clientX;sy=e.clientY;moved=false;ptr.on=true;ptr.x=e.clientX*dpr;ptr.y=e.clientY*dpr;idle=0;hint.style.opacity=0;cv.setPointerCapture(e.pointerId);holdT=setTimeout(()=>{if(!moved){toggleMic();ptr.on=false}},700)});
cv.addEventListener('pointermove',e=>{if(!ptr.on)return;ptr.x=e.clientX*dpr;ptr.y=e.clientY*dpr;if(Math.hypot(e.clientX-sx,e.clientY-sy)>14)moved=true;idle=0});
cv.addEventListener('pointerup',e=>{clearTimeout(holdT);ptr.on=false;const dx=e.clientX-sx;if(moved&&Math.abs(dx)>50){next(dx<0?1:-1)}else if(!moved&&performance.now()-down<500){const n=performance.now();if(n-lastTap<350){pal=(pal+1)%PAL.length;show();nameEl.textContent='Colours'}else next(1);lastTap=n}});
cv.addEventListener('pointercancel',()=>{clearTimeout(holdT);ptr.on=false});
addEventListener('wheel',e=>{next(e.deltaY>0?1:-1)},{passive:true});   // rotary crown / bezel

/* ---- microphone: bass swells the shape (optional) ---- */
let an=null,buf=null,micOn=false,stream=null;
async function toggleMic(){
  if(micOn){micOn=false;if(stream)stream.getTracks().forEach(t=>t.stop());an=null;nameEl.textContent='Mic off';nameEl.style.opacity=1;setTimeout(()=>nameEl.style.opacity=0,900);return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();const src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.6;src.connect(an);buf=new Uint8Array(an.frequencyBinCount);micOn=true;nameEl.textContent='Listening';nameEl.style.opacity=1;setTimeout(()=>nameEl.style.opacity=0,900)}
  catch(e){nameEl.textContent='No microphone';nameEl.style.opacity=1;setTimeout(()=>nameEl.style.opacity=0,1200)}
}
let ref=40;
function listen(dt){if(!an)return;an.getByteFrequencyData(buf);let b=0;for(let i=1;i<8;i++)b+=buf[i];b/=7;ref=Math.max(b,ref*Math.exp(-dt/5),30);const v=Math.max(0,Math.min(1,(b/ref-.55)*2.2));bass+=(v-bass)*(v>bass?.6:.15)}

/* ---- frame ---- */
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  const dt=now-last;if(dt<33)return;last=now;const d=Math.min(.045,dt/1000);
  slow=dt>45?slow+1:Math.max(0,slow-1);if(slow>20&&N>160){N=Math.round(N*.8);slow=0}else if(slow===0&&dt<36&&N<900&&(acc+=d)>6){N=Math.min(900,N+60);acc=0}
  t+=d;idle+=d;pulse*=Math.exp(-d/.35);listen(d);
  tilt.x+=(tilt.tx-tilt.x)*.12;tilt.y+=(tilt.ty-tilt.y)*.12;
  if(idle>40&&!micOn){cycle+=d;if(cycle>28){cycle=0;next(1)}}
  ang+=d*(.12+bass*.6+pulse*.3);
  const s=R*(1+.04*Math.sin(t*.6)+bass*.12+pulse*.06),ca=Math.cos(ang),sa=Math.sin(ang),cx=W/2+tilt.x*R*.06,cy=H/2+tilt.y*R*.06;
  x.globalCompositeOperation='source-over';x.fillStyle='rgba(5,6,10,'+(.16+bass*.1)+')';x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  const p=PATTERNS[pat],pl=PAL[pal],spd=.018+bass*.05,sz=Math.max(1.4,R/95);
  const px=ptr.on?ptr.x:0,py=ptr.on?ptr.y:0;
  for(let i=0;i<N;i++){const q=P[i];q.a+=spd*d*(1+(q.h-.5)*.6);if(q.a>1)q.a-=1;
    let [u,v]=p.f(q.k,q.a,t);
    let X=u*ca-v*sa,Y=u*sa+v*ca;
    const dn=Math.max(.45,1+.75*(X*tilt.x+Y*tilt.y));X/=dn;Y/=dn;       // 3D tilt
    const tx=cx+X*s,ty=cy+Y*s;
    // damped spring towards the curve (px, seconds), a slow wobble, and a swirl round the finger
    q.vx+=((tx-q.x)*70+Math.sin(t*1.3+i*.37)*R*1.1*(.4+bass))*d;q.vy+=((ty-q.y)*70+Math.cos(t*1.1+i*.53)*R*1.1*(.4+bass))*d;
    if(ptr.on){const dx=q.x-px,dy=q.y-py,r2=dx*dx+dy*dy,rr=R*.55;if(r2<rr*rr){const f=1-Math.sqrt(r2)/rr;q.vx+=(-dy*f*9+dx*f*1.5)*d;q.vy+=(dx*f*9+dy*f*1.5)*d}}
    const dm=Math.exp(-9*d);q.vx*=dm;q.vy*=dm;q.x+=q.vx*d;q.y+=q.vy*d;
    const hue=(pl[0]+(q.k/p.s)*.25+q.a*.12+t*.01)%1,l=.5+.12*Math.sin(q.a*TAU*3+t);
    x.fillStyle=hsl(hue,.9,Math.min(.75,l+pulse*.2+bass*.15));
    x.fillRect(q.x-sz/2,q.y-sz/2,sz,sz);
  }
}
const lut={};function hsl(h,s,l){const k=((h*72)|0)*32+((l*32)|0);return lut[k]||(lut[k]='hsl('+(h*360).toFixed(0)+' 90% '+(l*100).toFixed(0)+'%)')}
requestAnimationFrame(frame);
setTimeout(()=>{hint.style.opacity=0},6000);
</script></body></html>
