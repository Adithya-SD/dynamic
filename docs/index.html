<style>
:root{--f:-apple-system,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;color-scheme:dark;box-sizing:border-box}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:#05060a;color:#fff;font:500 14px var(--f);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.g{position:fixed;z-index:2;text-shadow:0 1px 8px #0006;transition:opacity .45s}
.g.ds>*{filter:blur(var(--b,0px));opacity:var(--o,1)}.g.gone{pointer-events:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
#ttl{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:11px 22px;display:flex;gap:9px;align-items:baseline;pointer-events:none;white-space:nowrap}
#ttl b{font-weight:650;letter-spacing:.2px}#ttl span{color:#fff9;font-weight:450}#fps{font-variant-numeric:tabular-nums;color:#fff7!important}#fps:empty{display:none}
#dock{left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:2px;padding:8px}
.k{position:relative;width:54px;height:54px;border-radius:27px;display:grid;place-items:center;transition:background .3s}
.k.on{background:rgba(255,255,255,.17)}.k:active{background:rgba(255,255,255,.28)}
.k svg{width:25px;height:25px;stroke-width:1.8}
.k i{position:absolute;right:7px;bottom:5px;font:650 10px var(--f);font-style:normal}
#sh{left:12px;right:12px;bottom:calc(94px + env(safe-area-inset-bottom,0px));height:min(62vh,560px);border-radius:38px;overflow:hidden;opacity:0;transform:translateY(26px) scale(.93);transform-origin:50% 100%;pointer-events:none;transition:opacity .35s,transform .6s cubic-bezier(.2,.9,.25,1.1);display:flex;flex-direction:column}
#sh.o{opacity:1;transform:none;pointer-events:auto}
#tabs{display:flex;margin:12px auto 6px;width:max-content;max-width:calc(100% - 20px);padding:4px;border-radius:22px;background:rgba(255,255,255,.1);gap:2px;flex:none;overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
#tabs button{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:18px;opacity:.68;transition:opacity .3s,padding .35s}
#tabs button svg{width:19px;height:19px;stroke-width:1.7;flex:none}
#tabs button span{max-width:0;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:600;transition:max-width .4s cubic-bezier(.2,.9,.25,1)}
#tabs button{flex:none}#tabs button.on{opacity:1;padding:0 13px 0 11px}#tabs button.on span{max-width:80px}
@media(max-width:480px){#tabs button{padding:0 8px}#tabs button.on{padding:0 11px 0 9px}}
#find{margin:2px 16px 6px;position:relative;flex:none}
#find input{width:100%;height:36px;border-radius:18px;border:0;outline:0;background:rgba(255,255,255,.09);color:#fff;font:500 14px var(--f);padding:0 14px 0 36px;transition:background .3s}
#find input:focus{background:rgba(255,255,255,.16)}#find input::placeholder{color:#fff8}
#find svg{position:absolute;left:12px;top:9px;width:18px;height:18px;stroke-width:1.8;opacity:.7}
#bd{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 26px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#fff3 transparent}
#cats{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}#cats::-webkit-scrollbar{display:none}#cats .ch{margin:0;flex:none;padding:8px 15px}
#pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.c{position:relative;height:92px;border-radius:24px;padding:11px 12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-weight:600;font-size:12.5px;text-align:left;border:1px solid rgba(255,255,255,.2);transition:transform .25s}
.c svg{width:28px;height:28px;stroke-width:1.6;filter:drop-shadow(0 1px 4px #0006)}
.c:active{transform:scale(.96)}.c.on{outline:2px solid #fff;outline-offset:-3px}
.c .fav{position:absolute;right:10px;top:9px;font-size:13px;opacity:.9}
.sl{margin:0 2px 4px;position:relative}
.sl>span{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px;opacity:.9;font-size:13px}
.sl em{font-style:normal;opacity:.6;font-variant-numeric:tabular-nums}
.padcur{position:fixed;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:1.5px solid #fffc;box-shadow:0 0 12px #fff8,inset 0 0 6px #fff6;pointer-events:none;z-index:4;opacity:0;transition:opacity .4s;mix-blend-mode:screen}.padcur.b{border-color:#9ef}.padcur.on{opacity:.85}
.sl .dot{display:inline-block;width:5px;height:5px;border-radius:3px;background:#fff;margin:0 0 2px 6px;opacity:0;transition:opacity .3s;vertical-align:middle}
.sl.chg .dot,.sw.chg .dot{opacity:.75}
.tr{position:relative;height:42px;touch-action:pan-y;--q:.5;outline:0}
.tr:before{content:"";position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--tk,rgba(255,255,255,.2));box-shadow:inset 0 1px 2px #0005;transition:height .35s,margin .35s}
.fl{position:absolute;left:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--fc,#fff);width:calc(14px + (100% - 28px)*var(--q));transition:height .35s,margin .35s}
.kn{position:absolute;top:50%;left:calc(14px + (100% - 28px)*var(--q));width:38px;height:24px;border-radius:14px;background:var(--kc,#fff);box-shadow:0 2px 10px #0006;transform:translate(-50%,-50%) scale(var(--sx,1),var(--sy,1));transition:width .5s cubic-bezier(.2,1.5,.35,1),height .5s cubic-bezier(.2,1.5,.35,1),border-radius .5s,background .35s,box-shadow .35s,transform .22s}
.touch .sl:not(.arm) .kn{width:30px;height:20px;opacity:.92}
.sl.arm .tr:before,.sl.arm .fl{height:10px;margin-top:-5px}
.sl.arm .kn{width:52px;height:32px;border-radius:16px;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 22px rgba(255,255,255,.35),0 6px 18px #0007}
.a .kn,.sl.arm.a .kn{width:68px;height:46px;border-radius:23px;background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.12) 55%,rgba(255,255,255,.3));-webkit-backdrop-filter:blur(2px) saturate(2) brightness(1.15);backdrop-filter:blur(2px) saturate(2) brightness(1.15);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -10px 14px rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.28),0 10px 28px rgba(0,0,0,.4)}
.ch{padding:9px 16px;border-radius:18px;background:rgba(255,255,255,.12);transition:background .3s,opacity .3s}.ch.on{background:rgba(255,255,255,.32)}
h4{margin:20px 4px 10px;font:650 12px var(--f);opacity:.55;letter-spacing:.3px;display:flex;justify-content:space-between}h4:first-child{margin-top:6px}
h5{margin:16px 4px 6px;font:650 11px var(--f);opacity:.4;letter-spacing:.6px;text-transform:uppercase}
.sg{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 12px}
.sw{margin:0 4px 12px}.sw>span{display:block;margin:0 0 8px;opacity:.9;font-size:13px}
.sw .row{display:flex;flex-wrap:wrap;gap:6px}
.sw .row button{width:46px;height:28px;border-radius:14px;border:1px solid rgba(255,255,255,.22);transition:transform .25s}
.sw .row button.on{outline:2px solid #fff;outline-offset:1px}.sw .row button:active{transform:scale(.92)}
.off{opacity:.38}
.mt{height:8px;margin:4px 4px 10px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.mt i{display:block;height:100%;background:#fff;transform-origin:0 50%;transform:scaleX(var(--l,0))}.mt.hit i{filter:brightness(1.9)}
.bands{display:flex;gap:2px;align-items:flex-end;height:34px;margin:4px 4px 10px}.bands i{flex:1;background:rgba(255,255,255,.75);border-radius:2px;height:calc(2px + 32px*var(--l,0));transition:height .05s}
.help{margin:4px 6px 12px;font-size:12px;color:#fff9;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;margin:0 4px 12px;font-size:13px}
.field input,.field select,textarea{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:14px;padding:10px 12px;font:500 13px var(--f);outline:0;width:100%}
textarea{resize:vertical;margin:0 0 10px;font-family:ui-monospace,monospace;font-size:12px;user-select:text;-webkit-user-select:text}
.field select option{background:#14161c}
.spotify{display:flex;gap:12px;align-items:center;margin:4px 4px 12px}.spotify img{width:58px;height:58px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.08)}.spotify img:not([src]){visibility:hidden}.spotify p{margin:2px 0;font-size:12px;color:#fff9}

#dlg::backdrop{background:transparent}
#dlg h2{margin:0 0 14px;font:650 17px var(--f);display:flex;justify-content:space-between;align-items:center}
#note{left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:12px 18px;max-width:min(520px,calc(100vw - 32px));font-size:13px;line-height:1.4;text-align:center}
.res h5:first-child{margin-top:4px}
@media(min-width:820px),(max-height:520px) and (orientation:landscape){#sh{left:auto;right:14px;width:min(420px,46vw);top:14px;height:auto;bottom:calc(94px + env(safe-area-inset-bottom,0px))}}
#boot{position:fixed;inset:0;z-index:9;display:grid;place-content:center;gap:18px;justify-items:center;background:#05060a;transition:opacity .6s}
#boot.out{opacity:0;pointer-events:none}#boot b{font:650 22px var(--f);letter-spacing:.4px}#boot p{margin:0;font-size:13px;color:#fff8}
#boot i{display:block;width:150px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;--p:.08}#boot i:after{content:"";display:block;height:100%;background:#fff;transform-origin:0 50%;transform:scaleX(var(--p));transition:transform .3s}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}

guments loses precision.\nfloat hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}\n\n// Continuous reflection into [0,1]: every space folds back onto the same sheet of fluid, so nothing samples off the edge.\nvec2 mirrorWrap(vec2 u){return 1.-abs(mod(u,2.)-1.);}\n\nvec2 rot2(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x-s*p.y,s*p.x+c*p.y);}\nvec2 cmul(vec2 a,vec2 b){return vec2(a.x*b.x-a.y*b.y,a.x*b.y+a.y*b.x);}\nvec2 cdiv(vec2 a,vec2 b){return vec2(a.x*b.x+a.y*b.y,a.y*b.x-a.x*b.y)/max(dot(b,b),1e-12);}\n\nvec3 hsv2rgb(vec3 c){vec3 p=abs(fract(c.xxx+vec3(0.,2./3.,1./3.))*6.-3.);return c.z*mix(vec3(1.),clamp(p-1.,0.,1.),c.y);}\nvec3 hueRotate(vec3 c,float a){const vec3 k=vec3(.57735);float ca=cos(a),sa=sin(a);return c*ca+cross(k,c)*sa+k*dot(k,c)*(1.-ca);}\nfloat luma(vec3 c){return dot(c,vec3(.299,.587,.114));}\n\n// Value noise for organic fields and glass shimmer.\nfloat vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);\n  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x),f.y);}\n\n// Dual-filter bloom. The first level keeps only light above a soft threshold.\nin vec2 v;out vec4 o;uniform sampler2D uSrc;uniform vec2 uTx;uniform float uThreshold,uFirst;\nvoid main(){\n  vec3 c=(texture(uSrc,v+uTx*vec2(-1,-1)).rgb+texture(uSrc,v+uTx*vec2(1,-1)).rgb+texture(uSrc,v+uTx*vec2(-1,1)).rgb+texture(uSrc,v+uTx*vec2(1,1)).rgb)*.25;\n  if(uFirst>.5){float l=max(c.r,max(c.g,c.b)),k=clamp(l-uThreshold+.25,0.,.5);k=k*k*2.;c*=max(k,l-uThreshold)/max(l,1e-4);}\n  o=vec4(c,1.);\n}\n","bloom_up.frag":"// Shared helpers. Hosts prepend: #version 300 es + highp precision for float, int, sampler2D.\nconst float PI=3.14159265359;\nconst float TAU=6.28318530718;\nconst float PHI=1.61803398875;\n\n// Sine-free hash: stable on mobile GPUs where sin() of large arguments loses precision.\nfloat hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);retu urn 1.-abs(mod(u,2.)-1.);}\n\nvec2 rot2(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x-s*p.y,s*p.x+c*p.y);}\nvec2 cmul(vec2 a,vec2 b){return vec2(a.x*b.x-a.y*b.y,a.x*b.y+a.y*b.x);}\nvec2 cdiv(vec2 a,vec2 b){return vec2(a.x*b.x+a.y*b.y,a.y*b.x-a.x*b.y)/max(dot(b,b),1e-12);}\n\nvec3 hsv2rgb(vec3 c){vec3 p=abs(fract(c.xxx+vec3(0.,2./3.,1./3.))*6.-3.);return c.z*mix(vec3(1.),clamp(p-1.,0.,1.),c.y);}\nvec3 hueRotate(vec3 c,float a){const vec3 k=vec3(.57735);float ca=cos(a),sa=sin(a);return c*ca+cross(k,c)*sa+k*dot(k,c)*(1.-ca);}\nfloat luma(vec3 c){return dot(c,vec3(.299,.587,.114));}\n\n// Value noise for organic fields and glass shimmer.\nfloat vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);\n  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x),f.y);}\n\n// Pass 1 at render resolution: fold space once per pixel, add particles, tone. Later passes read this texture\n// instead of re-folding, which is what made the old renderer expensive at high resolution.\n// Space: maps a screen pixel to the fluid sheet. The brush uses the same map (space.js / Space.kt),\n// so ink lands under the finger and every symmetric image appears at once.\n// Hosts compile one variant per space with `#define SPACE n` so each shader stays small and compiles fast:\n// 0 Plain, 1 Kaleido, 2 Prism (three-mirror kaleidoscope), 3 Hyperbolic {p,q}, 4 Golden spiral, 5 Two-pole spiral.\n#ifndef SPACE\n#define SPACE 0\n#endif\nuniform vec2 uRes;      // render size, pixels\nuniform float uWorld;   // simulated area / visible area (>=1)\nuniform float uSegs;    // kaleido segments\nuniform float uDepth;   // kaleido fold depth\nuniform float uSpin;    // accumulated rotation, radians\nuniform float uTile;    // tile size (prism, spiral bands)\nuniform vec2 uShift;    // accumulated drift for prism\nuniform vec4 uHyp;      // circle centre x, circle radius, triangle scale, p\nuniform vec2 uHypOff;   // places the fundamental triangle on the sheet\nuniform vec2 uMob;      // disk automorphism parameter, |uMob|<1\nuniform vec4 uSpiral;   // k=ln(growth)/2pi, ln(growth), arms, unused\nuniform vec2 uSpiralPhase;\nuniform vec4 uPoles;    // pole A xy, pole B xy (short-side units)\nuniform int uLoop;      // fold iteration cap; a uniform bound keeps D3D shader compilers from unrolling\nfloat gParity;          // number of mirror flips; tints alternate tiles\n\nvec2 sheetUV(vec2 q){float s=min(uRes.x,uRes.y);return .5+q*s/uRes/uWorld;}\n\nvec2 spaceMap(vec2 fc){\n  float sh=min(uRes.x,uRes.y);\n  vec2 q=(fc-.5*uRes)/sh;\n  gParity=0.;\n#if SPACE==1\n  q=rot2(q,uSpin);\n  float w=TAU/max(2.,floor(uSegs)),r=length(q),a=atan(q.y,q.x);\n  int nd=int(uDepth);\n  for(int j=0;j<nd;j++){float m=mod(a+float(j)*w*.37,w);gParity+=step(w*.5,m);a=abs(m-w*.5);if(j>0)r*=1.18;}\n  return sheetUV(r*vec2(cos(a),sin(a)));\n#elif SPACE==2\n  vec2 p=rot2(q,uSpin)/max(uTile,.05)+vec2(.5,.2887)+uShift;\n  const vec2 n1=vec2(.8660254,-.5),n2=vec2(-.8660254,-.5),B=vec2(1.,0.);\n  for(int i=0;i<uLoop;i++){bool inside=true;\n    if(p.y<0.){p.y=-p.y;gParity+=1.;inside=false;}\n    float d1=dot(p,n1);if(d1<0.){p-=2.*d1*n1;gParity+=1.;inside=false;}\n    float d2=dot(p-B,n2);if(d2<0.){p-=2.*d2*n2;gParity+=1.;inside=false;}\n    if(inside)break;}\n  return .5+(p-vec2(.5,.2887))*.9;\n#elif SPACE==3\n  vec2 z=rot2(q,uSpin)/.48;\n  float r2=dot(z,z);if(r2>1.){z/=r2;gParity+=1.;}\n  z=cdiv(z-uMob,vec2(1.,0.)-cmul(vec2(uMob.x,-uMob.y),z));\n  float w=TAU/uHyp.w,cr2=uHyp.y*uHyp.y;\n  for(int i=0;i<uLoop;i++){\n    float m=mod(atan(z.y,z.x),w);if(m>w*.5){m=w-m;gParity+=1.;}\n    z=length(z)*vec2(cos(m),sin(m));\n    vec2 d=z-vec2(uHyp.x,0.);float d2=dot(d,d);\n    if(d2>=cr2)break;\n    z=vec2(uHyp.x,0.)+d*(cr2/d2);gParity+=1.;}\n  return uHypOff+z*uHyp.z;\n#elif SPACE==4 || SPACE==5\n#if SPACE==5\n  vec2 z=cdiv(q-uPoles.xy,q-uPoles.zw);\n#else\n  vec2 z=rot2(q,uSpin);\n#endif\n  float lr=log(max(length(z),1e-6)),th=atan(z.y,z.x),s=lr-uSpiral       const mag=Math.hypot(x,y),sp=1.9*S*P.padspd*mag,c=this.cur[k];
      c[0]=clamp(c[0]+x*sp*dt/W,0,1);c[1]=clamp(c[1]+y*sp*dt/H,0,1);
      const id='pad'+k,on=mag>0||trig[k]>.08;
      if(on){this.idle[k]=0;let p=Input.ptr.get(id);
        if(!p){if(!Input.ptr.size)Engine.snapshot();p={x:c[0]*W,y:c[1]*H,fx:c[0]*W,fy:c[1]*H,o:Math.random()*6,t:0,h:0,id:++strokeCount};Input.ptr.set(id,p)}
        p.x=c[0]*W;p.y=c[1]*H;p.k=1+trig[k]*2;touch=Math.max(touch,mag*(.4+trig[k]*.6));UI.lastInput=performance.now();
      }else if((this.idle[k]+=dt)>.12)Input.ptr.delete(id);
      this.dots[k].style.transform=`translate(${c[0]*W}px,${c[1]*H}px)`;
    }
    const used=this.idle[0]<3||this.idle[1]<3;if(used!==!!this.shown){this.shown=used?1:0;this.dots.forEach(d=>d.classList.toggle('on',used))}
    if(std)for(const b of Pad.pressed(g))this.button(b);
    // Music rumble is sent from the analysis callback (Music.ingest) at audio rate; here only silence and Touch mode.
    const mode=P.rmode|0,gain=P.rgain,conf=(mode===1||mode===2?mode:0)+'/'+gain;
    if(NATIVE&&NATIVE.padConfig&&conf!==this.conf){this.conf=conf;NATIVE.padConfig(mode===1||mode===2?mode:0,gain)}
    if(!Music.active())Feel.silence(dt);
    if(mode===0)Pad.rumble(0,0);
    else if(mode===3||!Music.active())Pad.rumble(touch*.5*gain,touch*.8*gain);
    Pad.setLight(this.lightColor());
  },
  lightColor(){const c=paletteRGB(P.h+P.hr*fract(clock*.05+Feel.beat*.2)),v=.25+.75*Math.max(Feel.beat,Feel.lo);return c.map(z=>Math.round(clamp(z*v,0,1)*255))},
  button(b){
    switch(b){
      case 0:for(const c of this.cur){const a=Math.random()*TAU;Input.taps.push([c[0]*VW(),c[1]*VH(),Math.cos(a)*900,Math.sin(a)*900,Math.random()*6,++strokeCount])}Pad.tick(40,.6,.6);break;
      case 1:$('#ku').click();Pad.tick(25,.2,.5);break;
      case 2:UI.change('pal',(P.pal+1)%SCHEMA.palettes.length);notice('Palette: '+SCHEMA.palettes[P.pal][0],1500);Pad.tick(20,0,.6);break;
      case 3:UI.change('space',(P.space+1)%6);notice('Space: '+PDEF.space.o[P.space],1500);Pad.tick(30,.4,.3);break;
      case 4:case 5:UI.change('sym',clamp(P.sym+(b===5?1:-1),1,12));notice('Copies: '+P.sym,1200);Pad.tick(15,0,.5);break;
      case 8:$('#kz').click();break;
      case 9:case 12:UI.open?UI.shut():(UI.wake(),UI.show(UI.lastTab));break;
      case 10:Engine.snapshot();Engine.clear();Pad.tick(60,.8,0);break;
      case 13:UI.change('auto',P.auto>0?0:.3);notice(P.auto?'Auto motion on':'Auto motion off',1200);break;
      case 14:case 15:UI.cycle(b===15?1:-1);Pad.tick(25,.3,.3);break;
    }
  }
};

/* Frame loop. Order matches the Android host: input → stamps → solve → particles → display. */
const App={
  paused:false,snap:false,rec:null,displayHue:0,look:{exposure:1,hue:0,bloom:0,echoZoom:0,echoTwist:0,time:0},
  last:performance.now(),frames:0,fpsT:0,fps:0,cpu:0,diagT:0,
  ready:null,
  async start(){
    let done;this.ready=new Promise(r=>done=r);
    Engine.init();restore();Engine.wrap=!!P.edges;
    if(NATIVE&&!store.get('dynamic.phoneq',0)){P.rscale=.6;P.sim=192;store.set('dynamic.phoneq',1);persist()}   // phone GPUs: lighter first run
    if(!Engine.allocate(quality(),true)){P.rscale=.75;P.sim=192;if(!Engine.allocate(quality(),true)){notice(Engine.error);return}}
    UI.build();Input.init();Music.init();PadPlay.init();
    Space.update(P,0,Engine.res,Engine.world,0);
    const bar=$('#boot i');
    const errors=await Engine.warm((n,total)=>{if(bar)bar.style.setProperty('--p',n/total)});
    if(errors.length){const b=$('#boot');if(b)b.querySelector('p').textContent='Your graphics driver rejected a shader. Update it and reload.';console.error(errors.join(' | '));return}
    const boot=$('#boot');if(boot){boot.classList.add('out');setTimeout(()=>boot.remove(),700)}
    spotify.completeRedirect().catch(e=>notice(e.message));
    window.__importPreset=code=>decodePreset(code).then(pr=>{saved.push(pr);store.set('dynamic.saved',saved);applyPreset(allPresets().length-1);UI.cat='Mine';UI.renderCards();notice('Loaded “'+pr.n+'”.')}).catch(e=>notice(e.message));
    if(/[#&]p=/.test(location.hash)){window.__importPreset(location.hash);history.replaceState(null,'',location.pathname+location.search)}
    let rt=0;addEventListener('resize',()=>{UI.layoutDirty=true;clearTimeout(rt);rt=setTimeout(()=>{if(!Engine.allocate(quality()))notice(Engine.error)},120)});
    document.addEventListener('visibilitychange',()=>{this.last=performance.now();Music.events.length=0});
    document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;
      if(e.code==='Space'){e.preventDefault();$('#kz').click()}else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();$('#ku').click()}
      else if(e.key==='/'){e.preventDefault();if(!UI.open)UI.show(UI.lastTab);$('#q').focus()}else if(e.key==='Escape'&&UI.open)UI.shut()});
    cv.addEventListener('webglcontextlost',e=>{e.preventDefault();this.lost=true;notice('Graphics were reset by the system. Reload to continue; your settings are saved.',60000)});
    requestAnimationFrame(t=>this.frame(t));done();
    Engine.warmRest();
  },
  frame(now){requestAnimationFrame(t=>this.frame(t));if(!this.lost&&!document.hidden)this.tick(now)},
  tick(now){
    const cap=[30,60,90,120,144,0][P.hz],el=(now-this.last)/1000;
    if(cap&&el<1/cap-.002)return;
    if(!this.firstFrame){this.firstFrame=performance.now()}
    this.last=now;const dt=Math.min(Math.max(el,1/500),.05),t0=performance.now();
    this.frames++;this.fpsT+=el;if(this.fpsT>=.5){this.fps=this.frames/this.fpsT;this.frames=0;this.fpsT=0;this.adapt();$('#fps').textContent=P.st?Math.round(this.fps)+' fps':''}
    clock+=dt;stepMorph(dt);
    if(P.cyc&&!this.paused&&(this.cycT=(this.cycT||0)+dt)>20){this.cycT=0;UI.cycle()}

    Music.frame(dt);
    const beat=Music.beat,energy=Music.energy;
    Space.update(P,this.paused?0:dt,Engine.res,Engine.world,P.aspace*(energy*1.5+beat*2));
    PadPlay.frame(dt);
    Input.frame(dt);
    UI.depositStep();
    Engine.flushStamps(P.bt);

    const L=this.look;
    this.displayHue+=P.hdrift*dt*.6;
    L.exposure=P.glw*(1+P.aglow*beat*.35);L.hue=this.displayHue+(P.h-hueBase)*TAU;L.bloom=P.bloom*(1+P.aglow*(beat*1.5+energy));
    L.echoZoom=P.ezoom*.012*dt*60*(1+P.aspace*beat);L.echoTwist=P.etwist*.02*dt*60;L.time=clock;
    if(!this.paused){
      const sim=dt*P.ts*musicSpeed,n=Math.min(3,Math.ceil(sim/(1/60)-1e-6)),h=sim/Math.max(n,1);
      const g=[P.wx,P.wy];
      const field={mode:P.field|0,str:P.fs*500*(1+P.afield*(Music.bass*2.5+beat)),g,time:clock};
      for(let i=0;i<n;i++)Engine.step(h,P,field);
    }
    const ps=Input.ptr.size?[...Input.ptr.values()][0]:null,emit=ps?[Input.emitAt[0],Input.emitAt[1],1,.06]:[0,0,0,0];
    Engine.particles(dt*P.ts,P,emit,clock,paletteUniforms(),this.paused);
    UI.frame(dt);
    const dpr=Engine.res[0]/VW(),glass=UI.glass(dpr);
    if(this.rec&&now-this.rec.last>=1000/this.rec.fps){Engine.render(P,L,glass,false);this.rec.ctx.drawImage(cv,0,0,this.rec.c.width,this.rec.c.height);this.rec.last=now}
    if(this.snap){this.snap=false;Engine.capture(P,L,glass).toBlob(b=>b&&download(b,'dynamic.png'))}
    Engine.render(P,L,glass,true);
    this.cpu=this.cpu*.9+(performance.now()-t0)*.1;
    if(UI.open&&UI.tab===6&&now-this.diagT>1000){this.diagT=now;UI.diag.textContent=`${Math.round(this.fps)} fps · CPU ${this.cpu.toFixed(1)} ms · render ${Engine.res.join('×')} · sim ${Engine.sim.join('×')} · ink ${Engine.ink.join('×')} · GPU memory ~${Math.round(Engine.memoryMiB())} MiB · ${gl.getParameter(gl.RENDERER)}`}
    if(audio._media&&UI.seek){UI.seek.max=audio.duration||1;if(document.activeElement!==UI.seek)UI.seek.value=audio.position||0}
  },
  adapt(){   // phone only: if frames stay slow, shed resolution a step at a time
    if(!NATIVE||this.paused||UI.open&&UI.tab===6)return;
    this.slow=this.fps<40?(this.slow||0)+1:0;
    if(this.slow>=6&&P.rscale>.5){this.slow=0;P.rscale=Math.max(.5,+(P.rscale-.1).toFixed(2));Engine.allocate(quality());persist();UI.sync()}
  },
  record(){
    if(this.rec){this.rec.r.stop();return}
    if(!cv.captureStream||!window.MediaRecorder)throw Error('Recording is not available in this browser.');
    const c=el('canvas');c.width=cv.width;c.height=cv.height;const stream=c.captureStream(30),chunks=[];
    let dest=null;if(audio._source&&audio._ctx){dest=audio._ctx.createMediaStreamDestination();audio._source.connect(dest);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}
    const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime)throw Error('No supported video format.');
    const r=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16e6});
    r.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    r.onstop=()=>{this.rec=null;stream.getTracks().forEach(t=>t.stop());try{dest&&audio._source.disconnect(dest)}catch{}download(new Blob(chunks,{type:mime}),'dynamic.'+(mime.includes('mp4')?'mp4':'webm'));UI.recBtn.textContent='Record video'};
    r.start(1000);this.rec={r,c,ctx:c.getContext('2d'),fps:30,last:0};UI.recBtn.textContent='Stop recording';notice('Recording without the interface. Tap Stop recording to save.');
  }
};
App.start();

</script>
</body></html>
