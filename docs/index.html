<style>
:root{--f:-apple-system,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;color-scheme:dark;box-sizing:border-box}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:#05060a;color:#fff;font:500 14px var(--f);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.g{position:fixed;z-index:2;text-shadow:0 1px 8px #0006;transition:opacity .45s}
.g.ds>*{filter:blur(var(--b,0px));opacity:var(--o,1)}.g.gone{pointer-events:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
#ttl{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:11px 22px;display:flex;gap:9px;align-items:baseline;pointer-events:none;white-space:nowrap}
#ttl b{font-weight:650;letter-spacing:.2px}#ttl span{color:#fff9;font-weight:450}#fps{font-variant-numeric:tabular-nums;color:#fff7!important}#fps:empty{display:none}
#dock{left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:2px;padding:8px}
.k{position:relative;width:54px;height:54px;border-radius:27px;display:grid;place-items:center;transition:background .3s}
.k.on{background:rgba(255,255,255,.17)}.k:active{background:rgba(255,255,255,.28)}
.k svg{width:25px;height:25px;stroke-width:1.8}
.k i{position:absolute;right:7px;bottom:5px;font:650 10px var(--f);font-style:normal}
#sh{left:0;right:0;margin:0 auto;width:min(560px,calc(100vw - 24px));bottom:calc(94px + env(safe-area-inset-bottom,0px));height:min(62vh,560px);border-radius:38px;overflow:hidden;opacity:0;transform:translateY(26px) scale(.93);transform-origin:50% 100%;pointer-events:none;transition:opacity .35s,transform .6s cubic-bezier(.2,.9,.25,1.1);display:flex;flex-direction:column}
#sh.o{opacity:1;transform:none;pointer-events:auto}
#tabs{display:flex;margin:8px auto 6px;width:max-content;max-width:calc(100% - 20px);padding:4px;border-radius:22px;background:rgba(255,255,255,.1);gap:2px;flex:none;overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
#tabs button{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:18px;opacity:.68;transition:opacity .3s,padding .35s}
#tabs button svg{width:19px;height:19px;stroke-width:1.7;flex:none}
#tabs button span{max-width:0;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:600;transition:max-width .4s cubic-bezier(.2,.9,.25,1)}
#tabs button{flex:none}#tabs button.on{opacity:1;padding:0 13px 0 11px}#tabs button.on span{max-width:80px}
@media(max-width:480px){#tabs button{padding:0 8px}#tabs button.on{padding:0 11px 0 9px}}
#find{margin:2px 16px 6px;position:relative;flex:none}
#find input{width:100%;height:36px;border-radius:18px;border:0;outline:0;background:rgba(255,255,255,.09);color:#fff;font:500 14px var(--f);padding:0 14px 0 36px;transition:background .3s}
#find input:focus{background:rgba(255,255,255,.16)}#find input::placeholder{color:#fff8}
#find svg{position:absolute;left:12px;top:9px;width:18px;height:18px;stroke-width:1.8;opacity:.7}
#bd{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 26px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#fff3 transparent}
#cats{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}#cats::-webkit-scrollbar{display:none}#cats .ch{margin:0;flex:none;padding:8px 15px}
#hud{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;align-items:center;margin:14px 18px 0;padding:7px 12px;border-radius:16px;background:rgba(0,0,0,.22);font-size:12px;color:#fffb;font-variant-numeric:tabular-nums}
#hud b{color:#fff;font-weight:650}#hud em{font-style:normal;color:#fff7}#hud .dim{color:#fff8}
#hud .bpm{display:inline-flex;align-items:center;gap:6px}
#hud .bpm i{width:9px;height:9px;border-radius:50%;background:#fff3;transition:background .3s}
#hud .bpm.locked i{background:#58e08a}#hud .bpm.finding i{background:#f3c053}
#hud .bpm i.hit{animation:hit .25s ease-out}@keyframes hit{0%{transform:scale(1.9);box-shadow:0 0 12px #fff}100%{transform:scale(1)}}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:6px}
.gc{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;transition:transform .2s}
.gc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.gc span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 6px;font-size:11px;font-weight:600;background:linear-gradient(0deg,#000c,#0000);text-align:center;line-height:1.15}
.gc:active{transform:scale(.95)}.gc.on{outline:2px solid #fff;outline-offset:-3px}
#pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.c{position:relative;height:92px;border-radius:24px;padding:11px 12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-weight:600;font-size:12.5px;text-align:left;border:1px solid rgba(255,255,255,.2);transition:transform .25s}
.c svg{width:28px;height:28px;stroke-width:1.6;filter:drop-shadow(0 1px 4px #0006)}
.c:active{transform:scale(.96)}.c.on{outline:2px solid #fff;outline-offset:-3px}
.c.gp svg{display:none}.c.gp span{text-shadow:0 1px 4px #000}
.c .fav{position:absolute;right:10px;top:9px;font-size:13px;opacity:.9}
.sl{margin:0 2px 4px;position:relative}
.sl>span{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px;opacity:.9;font-size:13px}
.sl em{font-style:normal;opacity:.6;font-variant-numeric:tabular-nums}
.padcur{position:fixed;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:1.5px solid #fffc;box-shadow:0 0 12px #fff8,inset 0 0 6px #fff6;pointer-events:none;z-index:4;opacity:0;transition:opacity .4s;mix-blend-mode:screen}.padcur.b{border-color:#9ef}.padcur.on{opacity:.85}
.sl .dot{display:inline-block;width:5px;height:5px;border-radius:3px;background:#fff;margin:0 0 2px 6px;opacity:0;transition:opacity .3s;vertical-align:middle}
.sl.chg .dot,.sw.chg .dot{opacity:.75}
.tr{position:relative;height:42px;touch-action:pan-y;--q:.5;outline:0}
.tr:before{content:"";position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--tk,rgba(255,255,255,.2));box-shadow:inset 0 1px 2px #0005;transition:height .35s,margin .35s}
.fl{position:absolute;left:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--fc,#fff);width:calc(14px + (100% - 28px)*var(--q));transition:height .35s,margin .35s}
.kn{position:absolute;top:50%;left:calc(14px + (100% - 28px)*var(--q));width:38px;height:24px;border-radius:14px;background:var(--kc,#fff);box-shadow:0 2px 10px #0006;transform:translate(-50%,-50%) scale(var(--sx,1),var(--sy,1));transition:width .5s cubic-bezier(.2,1.5,.35,1),height .5s cubic-bezier(.2,1.5,.35,1),border-radius .5s,background .35s,box-shadow .35s,transform .22s}
.touch .sl:not(.arm) .kn{width:30px;height:20px;opacity:.92}
.sl.arm .tr:before,.sl.arm .fl{height:10px;margin-top:-5px}
.sl.arm .kn{width:52px;height:32px;border-radius:16px;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 22px rgba(255,255,255,.35),0 6px 18px #0007}
.a .kn,.sl.arm.a .kn{width:68px;height:46px;border-radius:23px;background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.12) 55%,rgba(255,255,255,.3));-webkit-backdrop-filter:blur(2px) saturate(2) brightness(1.15);backdrop-filter:blur(2px) saturate(2) brightness(1.15);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -10px 14px rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.28),0 10px 28px rgba(0,0,0,.4)}
.ch{padding:9px 16px;border-radius:18px;background:rgba(255,255,255,.12);transition:background .3s,opacity .3s}.ch.on{background:rgba(255,255,255,.32)}

/* Director: reads the song (beat clock, sections, drops, kick/snare/hat) and plays the scene like an instrument.
   It never edits your settings: every frame it copies P into E, bends E, and the engine draws E.
   Build-up: spin and tunnel zoom wind up, the frame tightens. Drop: colour jumps a third of the wheel, spin
   reverses, kaleidoscope segments change, light and flow surge. Downbeats nudge the hue; kicks twist the fluid;
   hats shimmer the colour. Calm passages breathe slowly. Strength = Music → Director. */

/* Frame governor and auto exposure.
   Governor: measures GPU time per frame (EXT_disjoint_timer_query_webgl2; frame rate when unavailable) and the
   screen's refresh rate. When frames run late it lowers resolution, ink detail, simulation cells and pressure steps
   one level at a time; with lasting headroom it climbs back. At the lowest level it halves the frame rate (144 → 72)
   so pacing stays even instead of stuttering. Pressure steps also scale with the time step, so 144 Hz costs about the
   same per second as 60 Hz.
   Exposure: four times a second a 16×16 sample of the composed frame is read back asynchronously; the brightest
   quarter is steered towards a fixed level, so a sparse frame is not blown out and a dense one is not pushed white. */

  first:true,level:0,refresh:60,cap:0,iv:[],queries:[],gpu:0,fps:0,slowN:0,fastN:0,last:0,tLast:0,

  auto(){return!P.qual},
  lvl(){return this.auto()?this.level:[0,0,1,3,4,5][P.qual|0]},
  quality(Q){const L=this.LEVELS[this.lvl()];return{...Q,rscale:Q.rscale*L[0],inkq:Q.inkq*L[1],sim:Math.max(96,Math.round(Q.sim*L[2]/16)*16),pq:L[4]}},
  iters(dt){const L=this.LEVELS[this.lvl()][3];return Math.max(6,Math.round(P.it*L*Math.min(1,dt*60*1.1+.25)))},
  /* Every rAF timestamp, drawn or not: the median interval is the display refresh. */

  targetHz(){const c=[30,60,90,120,144,0,-1][P.hz|0];if(c>0)return c;if(c===0)return 0;return this.cap||this.refresh},
  begin(){if(!timerExt)return null;const q=gl.createQuery();gl.beginQuery(timerExt.TIME_ELAPSED_EXT,q);return q},
  end(q){if(!q)return;gl.endQuery(timerExt.TIME_ELAPSED_EXT);this.queries.push(q);

const Exposure={
  k:1,t:0,pbo:null,fence:null,tiny:null,px:new Uint8Array(16*16*4),

    return;
    this.slow=this.fps<40?(this.slow||0)+1:0;
    if(this.slow>=6&&P.rscale>.5){this.slow=0;P.rscale=Math.max(.5,+(P.rscale-.1).toFixed(2));Engine.allocate(quality());persist();UI.sync()}
  },
  record(){
    if(this.rec){this.rec.r.stop();return}
    if(!cv.captureStream||!window.MediaRecorder)throw Error('Recording is not available in this browser.');
    const c=el('canvas');c.width=cv.width;c.height=cv.height;const stream=c.captureStream(30),chunks=[];
    let dest=null;if(audio._source&&audio._ctx){dest=audio._ctx.createMediaStreamDestination();audio._source.connect(dest);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}
    const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime)throw Error('No supported video format.');
    const r=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16e6});
    r.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    r.onstop=()=>{this.rec=null;stream.getTracks().forEach(t=>t.stop());try{dest&&audio._source.disconnect(dest)}catch{}download(new Blob(chunks,{type:mime}),'dynamic.'+(mime.includes('mp4')?'mp4':'webm'));UI.recBtn.textContent='Record video'};
    r.start(1000);this.rec={r,c,ctx:c.getContext('2d'),fps:30,last:0};UI.recBtn.textContent='Stop recording';notice('Recording without the interface. Tap Stop recording to save.');
  }
};
App.start();

</script>
