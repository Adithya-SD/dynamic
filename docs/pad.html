<style>
:root{--bg:#05060a;--fg:#f2f4fa;--dim:#fff9;--line:#ffffff1f;--glass:#ffffff0d;--lo:#ff6a3d;--hi:#56d8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;justify-content:center;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;width:min(560px,100%);padding:max(20px,env(safe-area-inset-top)) 16px 32px;display:flex;flex-direction:column;gap:14px}
h1{margin:6px 0 0;font-size:26px;font-weight:700;letter-spacing:.3px}h1 span{font-weight:400;color:var(--dim)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px 16px;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.card h2{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
#pad{display:flex;align-items:center;gap:12px}#pad b{font-weight:600}#pad i{width:10px;height:10px;border-radius:50%;background:#555;flex:none}#pad.on i{background:#5f8;box-shadow:0 0 10px #5f8}
#pad small{display:block;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--fg);background:#ffffff12;border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer}
button.on{background:#fff;color:#000;border-color:#fff}button:active{transform:scale(.97)}
#status{margin:10px 0 0;color:var(--dim);font-size:13px;min-height:1.4em}
.motors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m{position:relative;height:120px;border-radius:14px;background:#ffffff08;border:1px solid var(--line);overflow:hidden}
.m div{position:absolute;left:0;right:0;bottom:0;height:calc(var(--v,0)*100%);background:linear-gradient(to top,var(--c),transparent);transition:height .03s linear}
.m span{position:absolute;left:12px;top:10px;font-size:13px;color:var(--dim)}.m strong{position:absolute;right:12px;top:8px;font-variant-numeric:tabular-nums}
#lo{--c:var(--lo)}#hi{--c:var(--hi)}
#bands{display:flex;align-items:flex-end;gap:2px;height:56px;margin-top:12px}#bands i{flex:1;height:calc(2px + var(--l,0)*54px);border-radius:2px;background:linear-gradient(to top,var(--lo),var(--hi));opacity:.85}
label.s{display:flex;align-items:center;gap:12px;margin-top:6px}label.s input{flex:1;accent-color:#fff}label.s output{width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
p.help{margin:8px 0 0;color:var(--dim);font-size:13px}
a{color:#9ef}
#note{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;background:#000c;border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:calc(100% - 32px)}
input[type=file]{display:none}
</style></head>
<body>
<canvas id="bg"></canvas>
<main>
  <h1>Dynamic <span>Pad</span></h1>
  <section class="card"><div id="pad"><i></i><div><b id="padname">No controller yet</b><small id="padhint">Connect a controller and press any button.</small></div></div></section>
  <section class="card"><h2>Listen to</h2>
    <div class="row" id="src"></div><input type="file" id="file" accept="audio/*">
    <p id="status">Pick a source. The heavy motor plays the bass, the light motor plays the treble.</p>
  </section>
  <section class="card"><h2>Feel</h2>
    <div class="motors"><div class="m" id="lo"><div></div><span>Heavy · bass</span><strong>0</strong></div><div class="m" id="hi"><div></div><span>Light · treble</span><strong>0</strong></div></div>
    <div id="bands"></div>
    <div class="row" id="mode" style="margin-top:12px"></div>
    <div class="row" style="margin-top:10px;align-items:center"><span style="color:var(--dim);font-size:13px;margin-right:4px">Light motor</span><span class="row" id="hirow"></span></div>
    <label class="s">Strength<input id="gain" type="range" min="0" max="2" step="0.05"><output id="gainv"></output></label>
    <p class="help" id="modehelp"></p>
    <div class="row" style="margin-top:10px"><button id="test">Test motors</button><a style="align-self:center;margin-left:auto" id="open" href="index.html">Open Dynamic</a></div>
  </section>
</main>
<div id="note" hidden></div>
<script>
const TAU=Math.PI*2;
'use strict';
/* Small shared helpers. Every module below is concatenated in filename order by tools/build_web.py. */
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const fract=x=>x-Math.floor(x);
const VW=()=>innerWidth||document.documentElement.clientWidth||1;
const VH=()=>innerHeight||document.documentElement.clientHeight||1;
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
const store={
  get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch{return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
function hsv(h,s,v){h=fract(h)*6;const i=h|0,f=h-i,p=v*(1-s),q=v*(1-s*f),t=v*(1-s*(1-f));return[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6]}
const NATIVE=window.DynamicNative||null;   // set by the Android shell; absent in a normal browser
if(NATIVE)document.documentElement.classList.add('native');
const haptic=ms=>{try{NATIVE?NATIVE.haptic(ms):navigator.vibrate&&navigator.vibrate(ms)}catch{}};
async function download(blob,name){
  if(NATIVE){   // WebView cannot follow blob: downloads, so stream the file to the shell in 768 KB chunks
    NATIVE.beginSave(name,blob.type||'application/octet-stream');
    for(let o=0;o<blob.size;o+=786432){const buf=new Uint8Array(await blob.slice(o,o+786432).arrayBuffer());let b='';for(let i=0;i<buf.length;i+=8192)b+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));NATIVE.saveChunk(btoa(b))}
    notice(NATIVE.endSave());return;
  }
  const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function copyText(t){if(NATIVE){NATIVE.copy(t);return}await navigator.clipboard.writeText(t)}
const svgIcon=(d,cls='')=>`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="${d}"/></svg>`;
let noteTimer=0;
function notice(text,ms=5000){const n=$('#note');n.textContent=text;n.hidden=false;UI&&(UI.layoutDirty=true);clearTimeout(noteTimer);noteTimer=setTimeout(()=>{n.hidden=true;UI&&(UI.layoutDirty=true)},ms)}
var UI=null;

/* Browser audio capture and analysis.
   Audio thread (AudioWorklet): analysisCore() runs a 2048-point FFT every 128 samples (~375 frames/s) and reports
   24 log-spaced band levels plus a spectral-flux onset signal in four ranges (full, low, mid, high).
   Main thread: createSignal() adds automatic gain (quiet microphones and loud masters reach the same range) and
   per-band onsets; BeatTracker (42_beat.js) turns the onset signal into tempo, phase and predicted beats.
   analysisCore and createSignal are plain functions so node tests (tools/beat_test.mjs) run the exact same code. */
(function (root) {
  'use strict';

  const BAND_COUNT = 24;
  const FRAME = 29; // 24 levels, 4 onset ranges, time

  function analysisCore(sampleRate) {
    const N = 2048, MASK = N - 1, LAG = 4, GAMMA = .02; // gentle log compression: loud kicks still outweigh off-beat bass and hats
    const ring = new Float32Array(N), re = new Float32Array(N), im = new Float32Array(N), win = new Float32Array(N);
    const rev = new Uint16Array(N), cs = new Float32Array(N / 2), sn = new Float32Array(N / 2);
    for (let i = 0; i < N; i++) { win[i] = .5 - .5 * Math.cos(2 * Math.PI * i / (N - 1)); let x = i, r = 0; for (let b = 0; b < 11; b++) { r = (r << 1) | (x & 1); x >>= 1; } rev[i] = r; }
    for (let i = 0; i < N / 2; i++) { const a = -2 * Math.PI * i / N; cs[i] = Math.cos(a); sn[i] = Math.sin(a); }
    const bin = f => Math.max(1, Math.min(N / 2 - 1, Math.round(f * N / sampleRate)));
    const top = Math.min(16000, sampleRate * .475), K = bin(top) + 1, kLow = bin(180), kMid = bin(2500);
    const edges = new Uint16Array(BAND_COUNT + 1);
    for (let i = 0; i <= BAND_COUNT; i++) edges[i] = Math.max(1, Math.min(N / 2, Math.round(35 * Math.pow(top / 35, i / BAND_COUNT) * N / sampleRate)));
    // Log magnitudes of the last LAG frames: flux compares against the frame ~10 ms back, with a 3-bin max filter
    // so vibrato and slides do not read as onsets.
    const hist = []; for (let i = 0; i < LAG; i++) hist.push(new Float32Array(K));
    const mag = new Float32Array(K), levels = new Float32Array(BAND_COUNT), odf = new Float32Array(4);
    let write = 0, slot = 0;
    return {
